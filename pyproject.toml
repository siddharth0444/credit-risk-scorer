[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "1.0.0"
description = "Credit card default prediction with a cost-based decision policy, explanations and a fairness audit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Siddharth Rajak" }]
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "joblib>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
